name: deploy-proxy
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-proxy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping proxy deploy"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: "20"
      - name: Deploy worker
        if: steps.chk.outputs.ok == '1'
        id: dep
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          npx --yes wrangler@3.114.0 deploy 2>&1 | tee deploy.log
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@3.114.0 secret put GH_TOKEN >/dev/null && echo "::notice::5-minute trigger token installed in the worker"
          else
            echo "::warning::GH_DISPATCH_TOKEN not set — worker cron cannot start the pipeline yet"
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::no workers.dev URL in deploy output (is a workers.dev subdomain set up?)"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::proxy deployed at $URL"
      - name: Smoke test
        if: steps.chk.outputs.ok == '1'
        run: |
          sleep 5
          curl -sf -H "Origin: https://coder1x86.github.io" "${{ steps.dep.outputs.url }}/api/entry/4969994/" | python3 -c "import json,sys;d=json.load(sys.stdin);print('::notice::proxy OK — entry', d['id'], d['name'])"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.dep.outputs.url }}/api/my-team/4969994/"); [ "$code" = 404 ] && echo "::notice::private endpoint blocked (404) ✓"
      - name: Publish proxy URL to the app
        if: steps.chk.outputs.ok == '1'
        run: |
          echo "{\"proxy\":\"${{ steps.dep.outputs.url }}\"}" > dashboard/proxy.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/proxy.json
          git diff --cached --quiet || { git commit -m "proxy: ${{ steps.dep.outputs.url }}"; git push; }
