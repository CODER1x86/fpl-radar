# WildCard.exe cloud pipeline configuration. No secrets here: secrets live in GitHub Actions secrets.
[manager]
id = 4969994
team_name = "WildCard.exe"
timezone = "Africa/Cairo"

[squad]
# Used only when the public picks endpoint is unavailable. The pipeline prefers /api/entry/{id}/event/{gw}/picks/.
fallback_ids = [109, 497, 4, 175, 204, 304, 423, 427, 124, 368, 426, 571, 411, 346, 165]
# Estimated selling prices (GBP m). FPL only exposes real selling prices to the signed-in owner (/api/my-team/),
# so these are ESTIMATES derived from purchase price and the 50% sell-on rule. Shown as "estimate" everywhere.
[squad.selling_price_estimates]
411 = 15.6
426 = 11.8
4 = 7.9
427 = 7.9
165 = 7.7
368 = 6.8
124 = 5.8
346 = 6.0
571 = 4.8
109 = 4.5
204 = 4.5
423 = 4.3
175 = 3.9
304 = 4.0
497 = 4.0

[watchlist]
ids = [68, 330, 173, 8, 40, 154, 115, 13, 399, 94, 79, 566]

[intervals]
# Target intervals. The real cadence is limited by the GitHub Actions schedule (min 5 min, can be delayed).
fixtures_hours = 3
market_snapshot_minutes = 60
model_max_age_minutes = 60
model_min_gap_minutes = 15
validate_hours = 24
stale_after_minutes = 45
raw_snapshot_hours = 24
# projections are archived to git at most daily, plus hourly within this many hours of a deadline
archive_deadline_hours = 3

[alerts]
quiet_start_hour = 1   # local time; non-critical alerts are held into a digest during quiet hours
quiet_end_hour = 8
ownership_threshold = 15.0   # % selected_by to alert on status/price changes of non-squad players
dedup_hours = 72
dashboard_url = "https://coder1x86.github.io/fpl-radar/"

# Deadline-aware timing. Everything is computed from the API's UTC deadline_time of the specific gameweek,
# so it follows rescheduled/irregular deadlines and is independent of where you are. Local display and quiet
# hours use the IANA zone in [manager].timezone (DST handled by tz data, e.g. Egypt and UK clock changes).
[alerts.deadline]
reminder_hours = [48, 24, 6, 2]
final_check_minutes = 75
pre_quiet_minutes = 30        # a reminder falling in quiet hours is sent this long before quiet hours start
merge_within_minutes = 40     # reminders closer than this are merged into the more urgent one
quiet_override_hours = 12     # inside this window before a deadline, quiet hours are ignored for all alerts

[model]
horizon = 5
simulations = 6000
seed = 8
europe_teams = [1, 15, 14, 2, 3]   # ARS, MCI, LIV, AVL, BOU — rotation haircut

# Manual availability overrides: fraction of normal start probability for GW start_gw, start_gw+1, ...
# Each override must carry a source and an expiry; expired overrides are ignored automatically.
[[overrides]]
id = 368
name = "Szoboszlai"
start_gw = 8
availability = [0.0, 0.25, 0.55, 0.75, 0.75]
